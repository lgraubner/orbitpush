name: CI

on:
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-24.04
        strategy:
            matrix:
                # The lowest supported Node.js from engines in package.json, and the current LTS
                node-version: [22, 24]

        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - run: npm ci

            - run: npm run check

            - name: Run the bundle
              run: node dist/cli.js --help
